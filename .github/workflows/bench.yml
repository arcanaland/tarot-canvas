name: Bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: xcb

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps for Qt under Xvfb, with Mesa's software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libdbus-1-3

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install just
        uses: extractions/setup-just@v2.0.0

      - name: Install project
        run: uv sync --locked

      - name: Workloads, raster and GL
        run: |
          xvfb-run -a -s "-screen 0 1920x1200x24" \
            just bench run --platform xcb --viewport raster,gl \
            --cards 1,4 --frames 10 --warmup 2 --runs 1 --json bench.json
          just bench compare bench.json bench.json

      - name: Window surface probe
        run: |
          xvfb-run -a -s "-screen 0 1920x1200x24" \
            uv run python -m bench.window --json window.json
          jq -e '.[] | select(.variant == "eager") | .canvas.recreated == false' window.json
