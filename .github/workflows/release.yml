name: Release Package
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: '3.13'

    - name: Get version
      id: get_version
      run: |
        VERSION=$(uv version --short)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Create source package
      # DO NOT RENAME THIS ASSET.
      # It is part of the Flathub manifest's x-checker-data.
      run: ./scripts/make-tarball.sh ${{ steps.get_version.outputs.version }} .

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          tarot-canvas-${{ steps.get_version.outputs.version }}.tar.gz
          tarot-canvas-${{ steps.get_version.outputs.version }}.tar.gz.sha256
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: |
          tarot-canvas-${{ steps.get_version.outputs.version }}.tar.gz
          tarot-canvas-${{ steps.get_version.outputs.version }}.tar.gz.sha256
