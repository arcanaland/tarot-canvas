[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "tarot-canvas"
version = "1.10.0"
description = "Explore and arrange tarot decks"
authors = [{name = "Adam Fidel", email = "adam@arcana.land"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<4.0"
keywords = ["tarot", "qt6", "deck", "cards"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "arcana-tarot==0.5.0",
    "PyQt6>=6.8.0,<7.0.0",
    "requests>=2.31.0,<3.0.0",
    "tomli-w>=1.0,<2",
    "tomlkit>=0.13,<1",
    "xdg-base-dirs>=6.0.2,<7.0.0",
]

[project.urls]
homepage = "https://github.com/arcanaland/tarot-canvas"
repository = "https://github.com/arcanaland/tarot-canvas"

[project.scripts]
tarot-canvas = "tarot_canvas.main:main"

[project.gui-scripts]
tarot-canvas = "tarot_canvas.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-qt>=4.4,<5.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.6,<0.7",
    "import-linter>=2.17,<3.0",
]

[tool.importlinter]
root_packages = ["tarot_canvas"]

[[tool.importlinter.contracts]]
name = "Files outside ui shouldn't imports ui"
type = "forbidden"
source_modules = [
    "tarot_canvas.models",
    "tarot_canvas.utils",
    "tarot_canvas.settings",
    "tarot_canvas._version",
]
forbidden_modules = ["tarot_canvas.ui"]

[[tool.importlinter.contracts]]
name = "Widgets import only widgets and foundations"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["tarot_canvas.ui.widgets"]
forbidden_modules = [
    "tarot_canvas.ui.activate_on_return",
    "tarot_canvas.ui.canvas",
    "tarot_canvas.ui.card_colours",
    "tarot_canvas.ui.card_explorer",
    "tarot_canvas.ui.card_transfer",
    "tarot_canvas.ui.card_view",
    "tarot_canvas.ui.catalog",
    "tarot_canvas.ui.command_palette",
    "tarot_canvas.ui.commands",
    "tarot_canvas.ui.covers",
    "tarot_canvas.ui.dates",
    "tarot_canvas.ui.deck_view",
    "tarot_canvas.ui.dropped_files",
    "tarot_canvas.ui.focused_text",
    "tarot_canvas.ui.icons",
    "tarot_canvas.ui.library",
    "tarot_canvas.ui.main_window",
    "tarot_canvas.ui.metainfo",
    "tarot_canvas.ui.refresh_when_shown",
    "tarot_canvas.ui.spread_menu",
    "tarot_canvas.ui.style",
    "tarot_canvas.ui.tabs",
    "tarot_canvas.ui.windows",
]

[[tool.importlinter.contracts]]
name = "The Library doesn't import tabs directly"
type = "forbidden"
source_modules = ["tarot_canvas.ui.library"]
forbidden_modules = ["tarot_canvas.ui.tabs"]
ignore_imports = [
    # The Library tab is a tab
    "tarot_canvas.ui.library.tab -> tarot_canvas.ui.tabs.base_tab",
]

[[tool.importlinter.contracts]]
name = "App-wide services import no screen"
type = "forbidden"
source_modules = ["tarot_canvas.ui.covers", "tarot_canvas.ui.catalog"]
forbidden_modules = [
    "tarot_canvas.ui.library",
    "tarot_canvas.ui.tabs",
    "tarot_canvas.ui.windows",
]

[[tool.importlinter.contracts]]
name = "A Library view imports no other view but decks"
type = "independence"
modules = [
    "tarot_canvas.ui.library.notes",
    "tarot_canvas.ui.library.spreads",
    "tarot_canvas.ui.library.esoterica",
    "tarot_canvas.ui.library.readings",
]

[[tool.importlinter.contracts]]
name = "Decks imports no other Library view"
type = "forbidden"
source_modules = ["tarot_canvas.ui.library.decks"]
forbidden_modules = [
    "tarot_canvas.ui.library.notes",
    "tarot_canvas.ui.library.spreads",
    "tarot_canvas.ui.library.esoterica",
    "tarot_canvas.ui.library.readings",
]

[tool.poetry]
packages = [{include = "tarot_canvas"}]
include = ["tarot_canvas/resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tarot_canvas"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "T20"]
ignore = ["E501"]  # ruff format owns line length

[tool.ruff.lint.per-file-ignores]
# Their output is their interface; the app logs
"bench/**" = ["T20"]
"scripts/**" = ["T20"]
