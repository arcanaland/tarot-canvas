[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "tarot-canvas"
version = "1.3.0"
description = "A cross-platform Qt6 application for viewing and exploring tarot decks"
authors = [{name = "Adam Fidel", email = "adam@fidel.cloud"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
keywords = ["tarot", "qt6", "deck", "cards"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.5.0,<7.0.0",
    "requests>=2.31.0,<3.0.0",
    "xdg-base-dirs>=6.0.2,<7.0.0",
]

[project.urls]
homepage = "https://github.com/arcanaland/tarot-canvas"
repository = "https://github.com/arcanaland/tarot-canvas"

[project.scripts]
tarot-canvas = "tarot_canvas.main:main"

[project.gui-scripts]
tarot-canvas = "tarot_canvas.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-qt>=4.4,<5.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.7",
]

[tool.poetry]
packages = [{include = "tarot_canvas"}]
include = ["tarot_canvas/resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # ruff format owns line length
