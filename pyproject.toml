[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tarot-canvas"
version = "1.2.0"
description = "A cross-platform Qt6 application for viewing and exploring tarot decks"
authors = ["Adam Fidel <adam@fidel.cloud>"]
readme = "README.md"
packages = [{include = "tarot_canvas"}]
include = ["tarot_canvas/resources/**/*"]
license = "MIT"
homepage = "https://github.com/arcanaland/tarot-canvas"
repository = "https://github.com/arcanaland/tarot-canvas"
keywords = ["tarot", "qt6", "deck", "cards"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
PyQt6 = "^6.5.0"
requests = "^2.31.0"
xdg-base-dirs = "^6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-qt = "^4.4"
pytest-cov = "^5.0"
ruff = "^0.6"

[tool.poetry.scripts]
tarot-canvas = "tarot_canvas.main:main"

[tool.poetry.plugins."gui_scripts"]
tarot-canvas = "tarot_canvas.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # ruff format owns line length
